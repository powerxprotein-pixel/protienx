<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadowB">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <g filter="url(#shadowB)">
    <!-- Cap -->
    <rect x="70" y="20" width="60" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <!-- Bottle -->
    <rect x="50" y="46" width="100" height="165" rx="16" fill="url(#botGrad)"/>
    <!-- Label -->
    <rect x="54" y="70" width="92" height="125" rx="4" fill="#ffffff"/>
    <text x="100" y="92" fill="#1e293b" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1" text-anchor="middle">POWERX</text>
    <text x="100" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">FISH OIL</text>
    <rect x="62" y="124" width="76" height="20" rx="3" fill="#f59e0b"/>
    <text x="100" y="138" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="800" text-anchor="middle">300mg OMEGA</text>
    <text x="100" y="160" fill="#64748b" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">1000mg Heart & Joint</text>
  </g>
</svg>